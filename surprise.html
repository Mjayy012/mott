<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Monthsary ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://drive.google.com">
  <link rel="preconnect" href="https://drive.usercontent.google.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Caveat:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/monthsary.css">
</head>
<body class="hero-page">
  <div id="particle-field" aria-hidden="true"></div>

  <div id="experience">
    <section id="hero" class="chapter">
      <div class="hero-eyebrow" id="hero-eyebrow">a little film, just for you</div>
      <h1 class="hero-title">Happy Monthsary,<br>My Love ❤️</h1>
      <p class="hero-months" id="hero-months">— Months of Us</p>
      <p class="hero-names" id="hero-names">Name ❤️ Name</p>
      <button class="hero-btn" id="open-story-btn">Open Our Story 💕</button>
      <button class="scroll-cue" id="open-story-arrow" aria-label="Open our story">⟶</button>
    </section>
  </div>

  <div id="music-control" class="tucked" aria-hidden="true">
    <button id="music-toggle" aria-label="Play or pause music">♪</button>
    <div class="music-extra">
      <button id="mute-toggle" aria-label="Mute or unmute music">🔊</button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" aria-label="Volume">
    </div>
  </div>
  <audio id="bg-audio" loop preload="none"></audio>

  <script src="assets/config.js" defer></script>
  <script src="assets/shared.js" defer></script>
  <script src="assets/music.js" defer></script>
  <script src="assets/surprise.js" defer></script>
</body>
</html>
