<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Little Surprise For You ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://drive.google.com">
  <link rel="preconnect" href="https://drive.usercontent.google.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Caveat:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/monthsary.css">
</head>
<body class="unlock-page">
  <div id="particle-field" aria-hidden="true"></div>

  <section id="lock-screen" role="dialog" aria-label="Enter your monthsary code">
    <div class="lock-card">
      <div class="lock-icon" aria-hidden="true">🔐</div>
      <h1 class="lock-title">A Little Surprise For You ❤️</h1>
      <p class="lock-subtitle">Enter our special 6-digit code to unlock your surprise.</p>

      <form id="pin-form" autocomplete="off">
        <div class="pin-row" id="pin-row">
          <input class="pin-box" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 1" data-index="0">
          <input class="pin-box" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2" data-index="1">
          <input class="pin-box" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3" data-index="2">
          <input class="pin-box" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4" data-index="3">
          <input class="pin-box" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5" data-index="4">
          <input class="pin-box" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 6" data-index="5">
        </div>
      </form>

      <p class="lock-hint">Hint: It's a special date that belongs to us. 👀❤️</p>
      <p class="lock-message" id="lock-message" aria-live="polite">&nbsp;</p>
    </div>

    <div class="lock-welcome" id="lock-welcome">Welcome, My Love ❤️</div>
  </section>

  <script src="assets/config.js" defer></script>
  <script src="assets/shared.js" defer></script>
  <script src="assets/index.js" defer></script>
</body>
</html>
